# Todos los microservicios necesitan registrarse en Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

# Todos los microservicios (que son Resource Servers) necesitan validar los JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/unnoba

# Solución para WSL/Windows: Forzamos a que se registren con su IP y no con el nombre de la PC
eureka.instance.prefer-ip-address=true